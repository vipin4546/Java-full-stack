services:

  mysql:
    image: mysql:8.4
    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: student_db

    ports:
      - "3307:3306"

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345678" ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: student-management-app

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"